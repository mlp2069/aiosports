<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIOSports — Sign in</title>
<link rel="icon" type="image/png" href="/logo-v2.png">
<link rel="apple-touch-icon" href="/logo-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  /*
   * Page-scoped layout only. Colour, type, spacing, radii, shadow, focus ring,
   * button and input behaviour all come from /app.css. Nothing here invents a
   * colour, a duration or an easing.
   */

  /* dvh first with a vh fallback: on iOS Safari 100vh is taller than the
     visible viewport, so a "centred" card sits low and the keyboard shoves it
     off the bottom. */
  .gate {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: var(--s5) var(--s4);
    /* The one page-specific flourish, built from the accent wash token so no
       new colour enters the system. */
    background: radial-gradient(60rem 30rem at 50% -10%, var(--accent-wash), transparent 65%);
  }

  /* 22rem, not .page--narrow's 34rem: that measure is sized for reading, and
     this card holds one field. */
  .gate__card { width: 100%; max-width: 22rem; }

  .gate__mark {
    display: block;
    width: var(--s7); height: var(--s7);
    border-radius: var(--r-md);
    margin-bottom: var(--s4);
  }

  .gate__sub { font: var(--t-small); color: var(--text-dim); margin: var(--s2) 0 var(--s5); }
  .gate__field { margin-bottom: var(--s4); }

  /* The message slot keeps its height while empty (one line of --t-small), so
     the card does not grow the first time an error appears and shift the
     button out from under the pointer. */
  #msg {
    min-height: 1.25rem;
    margin-top: var(--s3);
    font: var(--t-small);
    color: var(--danger);
  }
  /* Animation 1 of 2 — see the report. Re-arms every attempt because the
     script clears #msg before each fetch, which drops the :not(:empty) match. */
  #msg:not(:empty) { animation: rise var(--d-panel) var(--ease-out) both; }

  /* The field carries the failure too, driven entirely by the text the script
     already writes. No extra scripting, and it clears itself on the next try. */
  #form:has(#msg:not(:empty)) #key { border-color: var(--danger); }

  /* Animation 2 of 2. #go is disabled only while the request is in the air, so
     :disabled is exactly the pending state. Absolute + auto margins centres it
     without a transform, leaving transform free for the rotation. */
  #go { position: relative; }
  #go:disabled::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0; right: var(--s4);
    margin: auto 0;
    width: var(--s4); height: var(--s4);
    border: 2px solid color-mix(in srgb, currentColor 28%, transparent);
    border-top-color: currentColor;
    border-radius: var(--r-full);
    animation: gate-spin calc(var(--d-modal) * 3) linear infinite;
  }
  @keyframes gate-spin { to { transform: rotate(1turn); } }
</style>
</head>
<body>
  <main class="gate">
    <form class="card card--raised gate__card" id="form">
      <img class="gate__mark" src="/logo-v2.png" alt="" width="48" height="48">
      <h1>AIOSports</h1>
      <p class="gate__sub">Sign in to browse the catalog.</p>

      <div class="field gate__field">
        <label class="field__label" for="key">Password</label>
        <input id="key" type="password" autocomplete="current-password" required autofocus
               enterkeyhint="go" aria-describedby="key-hint msg">
        <span class="field__hint" id="key-hint">The AUTH_KEY set on your AIOSports container.</span>
      </div>

      <button class="btn btn--primary btn--block btn--lg" type="submit" id="go">Sign in</button>
      <div id="msg" role="alert" aria-live="assertive"></div>
    </form>
  </main>

<script>
const form = document.getElementById('form');
const key = document.getElementById('key');
const go = document.getElementById('go');
const msg = document.getElementById('msg');

form.onsubmit = async e => {
  e.preventDefault();
  if (!key.value) return;
  go.disabled = true;
  msg.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'x-auth-key': key.value }
    });
    const body = await res.json().catch(() => ({}));
    if (res.ok && body.authenticated) {
      // Straight to the catalog, which is what someone signing in came for.
      location.replace('/');
      return;
    }
    msg.textContent = res.status === 429
      ? 'Too many attempts. Wait a few minutes.'
      : (body.error || 'That password was not accepted.');
  } catch (err) {
    msg.textContent = 'Cannot reach the server: ' + err.message;
  }
  go.disabled = false;
  key.select();
};
</script>
</body>
</html>
